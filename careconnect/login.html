<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CareConnect — Sign In | Curaah</title>
  <meta name="description" content="Sign in to CareConnect — the coordination platform for NGOs, volunteers, blood banks, and healthcare professionals." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/shared.css" />
</head>
<body>

  <!-- Single auth screen -->
  <div class="screen auth active" id="screen-login">

    <div class="auth-card">

      <!-- Logo -->
      <div class="auth-logo">
        <img src="/assets/logo.svg" alt="Curaah logo" />
        <div>
          <div class="brand-name">CareConnect</div>
          <div class="brand-tag">by Curaah</div>
        </div>
      </div>

      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-sub">Sign in to your CareConnect account</p>

      <!-- Login form -->
      <form id="login-form" novalidate>

        <div class="form-group" id="fg-email">
          <label class="form-label" for="email">
            Email address <span class="required">*</span>
          </label>
          <input
            id="email"
            type="email"
            class="input"
            placeholder="you@example.com"
            autocomplete="email"
            inputmode="email"
          />
          <div class="form-error" id="err-email"></div>
        </div>

        <div class="form-group" id="fg-password">
          <label class="form-label" for="password">
            Password <span class="required">*</span>
          </label>
          <input
            id="password"
            type="password"
            class="input"
            placeholder="Min. 8 characters"
            autocomplete="current-password"
          />
          <div class="form-error" id="err-password"></div>
        </div>

        <!-- Global error (wrong credentials etc.) -->
        <div id="login-error" class="alert alert-danger mb-16" style="display:none;">
          <span class="alert-icon">⚠</span>
          <span id="login-error-text"></span>
        </div>

        <button
          id="btn-login"
          type="submit"
          class="btn btn-primary btn-lg btn-full"
        >
          Sign In
        </button>

      </form>

      <div class="divider-text mt-24">or</div>

      <a href="/careconnect/register.html" class="btn btn-ghost btn-lg btn-full">
        Create a new account
      </a>

      <p class="text-caption text-center mt-16">
        Are you a patient or health-conscious user?<br />
        <a href="/app/login.html" class="text-blue">Open Curaah App →</a>
      </p>

    </div>

  </div><!-- /.screen -->

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Config (creates supabase client + constants) -->
  <script src="/js/config.js"></script>
  <!-- Utilities -->
  <script src="/js/utils/toast.js"></script>
  <script src="/js/utils/validate.js"></script>
  <script src="/js/utils/dom.js"></script>
  <!-- Page logic -->
  <script src="/careconnect/js/login.js"></script>

</body>
</html>

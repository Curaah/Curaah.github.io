<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Blood Bank Dashboard | CareConnect</title>
  <meta name="description" content="Manage your blood bank inventory, respond to emergency requests, and track donations." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/shared.css" />
  <style>
    /* Inventory grid */
    .inv-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    @media (max-width: 360px) { .inv-grid { grid-template-columns: repeat(2, 1fr); } }
    .inv-cell {
      background: var(--card);
      border: 1.5px solid var(--line);
      border-radius: var(--r);
      padding: 12px 8px;
      text-align: center;
      transition: var(--t);
    }
    .inv-cell.low   { border-color: var(--red);   background: var(--red-a); }
    .inv-cell.good  { border-color: var(--green); background: var(--green-a); }
    .inv-cell.empty { border-color: var(--line);  background: var(--card); opacity: .6; }
    .inv-group {
      font-family: 'Outfit', sans-serif;
      font-size: 15px; font-weight: 900;
      color: var(--red);
      margin-bottom: 4px;
    }
    .inv-units {
      font-family: 'Outfit', sans-serif;
      font-size: 22px; font-weight: 900;
      line-height: 1;
    }
    .inv-units.text-red { color: var(--red); }
    .inv-units.text-green { color: var(--green); }
    .inv-label { font-size: 9px; color: var(--muted); margin-top: 2px; }
    .inv-btn { font-size: 10px; margin-top: 6px; }

    /* Emergency card */
    .emergency-card {
      background: linear-gradient(135deg, #1f0a0a, #280d0d);
      border: 1.5px solid var(--red-b);
      border-radius: var(--r);
      padding: 16px;
      margin-bottom: 10px;
      animation: urgentPulse 2s ease-in-out infinite;
    }
    @keyframes urgentPulse {
      0%, 100% { border-color: var(--red-b); }
      50%       { border-color: var(--red); }
    }
    .emergency-header {
      display: flex; align-items: center; gap: 12px; margin-bottom: 8px;
    }
    .emer-group-badge {
      width: 48px; height: 48px; border-radius: 50%;
      border: 2px solid var(--red);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 900;
      color: var(--red); background: var(--red-a); flex-shrink: 0;
    }
    .emer-title { font-size: 14px; font-weight: 700; color: var(--red); }
    .emer-meta  { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .emer-actions { display: flex; gap: 8px; margin-top: 10px; }
  </style>
</head>
<body>

  <!-- TOP NAV -->
  <nav class="top-nav">
    <div class="brand">
      <img src="/assets/logo.svg" alt="Curaah" />
      <div>
        <span>CareConnect</span>
        <span class="brand-sub">Blood Bank</span>
      </div>
    </div>
    <button class="nav-action" id="btn-update-inv" title="Update Inventory">✏️</button>
  </nav>

  <!-- PAGE -->
  <div class="screen page active" id="screen-dashboard">
    <div class="page-content" style="max-width:600px; margin:0 auto;">

      <!-- Bank name + status -->
      <div class="mb-16">
        <h1 class="text-h3" id="bank-name">Loading…</h1>
        <div class="flex items-center gap-8 mt-4">
          <span class="badge badge-green badge-live">Open</span>
          <span class="text-small text-muted" id="bank-hours">—</span>
        </div>
      </div>

      <!-- Blood inventory -->
      <div class="section-title">🩸 Blood Inventory</div>
      <div class="inv-grid" id="inv-grid">
        <!-- Built by JS for all 8 blood groups -->
      </div>

      <button class="btn btn-primary btn-full mb-20" id="btn-update-all">
        ✏️ Update All Stock
      </button>

      <!-- Active emergency requests -->
      <div class="section-title">🚨 Emergency Requests</div>
      <div id="emergency-list">
        <div style="text-align:center; padding:20px; color:var(--dim); font-size:13px;">
          <span style="font-size:28px; display:block; margin-bottom:8px;">✅</span>
          No active emergency requests right now.
        </div>
      </div>

      <!-- Stats -->
      <div class="section-title" style="margin-top:24px;">📊 This Month</div>
      <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:24px;">
        <div style="background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;text-align:center;">
          <div style="font-family:'Outfit',sans-serif;font-size:22px;font-weight:900;color:var(--red);" id="stat-requests">—</div>
          <div style="font-size:10px;color:var(--muted);">Requests received</div>
        </div>
        <div style="background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;text-align:center;">
          <div style="font-family:'Outfit',sans-serif;font-size:22px;font-weight:900;color:var(--green);" id="stat-fulfilled">—</div>
          <div style="font-size:10px;color:var(--muted);">Fulfilled</div>
        </div>
        <div style="background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;text-align:center;">
          <div style="font-family:'Outfit',sans-serif;font-size:22px;font-weight:900;color:var(--blue);" id="stat-units">—</div>
          <div style="font-size:10px;color:var(--muted);">Units supplied</div>
        </div>
      </div>

    </div>
  </div>

  <!-- BOTTOM TABS -->
  <nav class="bottom-tabs">
    <div class="tab-item active" onclick="location.href='/careconnect/dashboard-blood-bank.html'">
      <span class="tab-icon">🏠</span>
      <span class="tab-label">Home</span>
    </div>
    <div class="tab-item" onclick="location.href='/careconnect/blood-emergency.html'">
      <span class="tab-icon">🚨</span>
      <span class="tab-label">Requests</span>
    </div>
    <div class="tab-item" onclick="location.href='/careconnect/feed.html'">
      <span class="tab-icon">📰</span>
      <span class="tab-label">Feed</span>
    </div>
    <div class="tab-item" onclick="location.href='/careconnect/profile.html'">
      <span class="tab-icon">🏥</span>
      <span class="tab-label">Profile</span>
    </div>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/utils/toast.js"></script>
  <script src="/js/utils/format.js"></script>
  <script src="/js/utils/dom.js"></script>
  <script src="/careconnect/js/auth-guard.js"></script>
  <script src="/careconnect/js/dashboard-blood-bank.js"></script>

</body>
</html>
